[project]
name = "chat-pydantic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<0.14",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.workspace]
members = ["services/*"]

[tool.pytest.ini_options]
testpaths = ["services/chat-api/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
