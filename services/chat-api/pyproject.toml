[project]
name = "chat-api"
version = "0.1.0"
description = "FastAPI service for conversations and Pydantic AI agents"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "logfire[fastapi,sqlalchemy]>=4,<5",
    "pydantic>=2.11,<3",
    "pydantic-ai-harness>=0.29,<0.30",
    "pydantic-ai-slim[openai]>=2.39,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"
